plugins {
    id 'com.android.application'
}

android {
    namespace 'ph.nihongo.steps'
    compileSdk 35

    defaultConfig {
        applicationId 'ph.nihongo.steps'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external libraries: the app uses only the Android framework
// (TextToSpeech, RecognizerIntent, AppWidget, org.json).
